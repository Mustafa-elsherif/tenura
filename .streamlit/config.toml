[theme]
base = "light"
primaryColor = "#09674F"
backgroundColor = "#F5F7F5"
secondaryBackgroundColor = "#EAF1EC"
textColor = "#172820"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#10281F"
secondaryBackgroundColor = "#213D32"
textColor = "#F3F8F4"
