name: Dashboard checks and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m deployment.build_pages _site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  verify-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYSPARK_SUBMIT_ARGS: '--master local[2] --conf spark.sql.shuffle.partitions=4 pyspark-shell'
      SPARK_LOCAL_IP: '127.0.0.1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - run: python -m pip install -r requirements-training.txt
      - run: python -m tests.check_prediction_parity

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test-and-build, verify-models]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
