# Tenura — full stack: FastAPI backend + nginx-served dashboard.
# One command:  docker compose up --build
# Then open the dashboard at http://localhost:8080 (API docs at http://localhost:8000/docs)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tenura-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
        VITE_BASE: /
    image: tenura-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
